<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nadeyar Duhoky - Exploit Host</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #121212 !important;
        color: #e0e0e0 !important;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    h1 {
        font-size: 24px;
        text-align: center;
        margin-bottom: 5px;
        color: #00e5ff !important;
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        line-height: 1.4;
    }

    h3#UA {
        font-size: 14px;
        color: #b0bec5 !important;
        margin-bottom: 15px;
        font-weight: normal;
        text-align: center;
    }

    hr {
        width: 80%;
        max-width: 450px;
        border: 0;
        height: 1px;
        background: #424242 !important;
        margin-bottom: 15px;
    }

    /* کودی تێکستێ جووڵاو (Ticker) */
    .ticker-container {
        width: 100%;
        max-width: 450px;
        background-color: #1e1e1e !important;
        border: 1px solid #333 !important;
        border-radius: 8px;
        overflow: hidden;
        white-space: nowrap;
        box-sizing: border-box;
        margin-bottom: 15px;
        padding: 8px 0;
    }

    .ticker-text {
        display: inline-block;
        padding-left: 100%;
        animation: ticker 18s linear infinite;
        color: #00e676 !important;
        font-size: 13px;
        font-weight: 600;
        text-shadow: 0 0 5px rgba(0, 230, 118, 0.3);
    }

    @keyframes ticker {
        0% {
            transform: translate3d(0, 0, 0);
        }
        100% {
            transform: translate3d(-100%, 0, 0);
        }
    }

    .btn-container {
        background-color: #1e1e1e !important;
        border: 1px solid #333 !important;
        padding: 20px;
        border-radius: 15px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7) !important;
        margin-bottom: 20px;
        text-align: center;
    }

    #kernel-options {
        margin-bottom: 15px;
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    #kernel-options label {
        cursor: pointer;
        font-weight: 600;
        color: #cfd8dc !important;
    }

    #jeilbrek {
        background-color: #007acc !important;
        color: #fff !important;
        border: none !important;
        padding: 12px 30px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        transition: 0.3s;
        box-shadow: 0 4px 15px rgba(0, 122, 204, 0.4) !important;
    }

    #jeilbrek:hover {
        background-color: #0097f7 !important;
        transform: translateY(-2px);
    }

    .autoJb {
        margin-top: 15px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        font-size: 14px;
    }

    #autoJbLabel {
        color: #cfd8dc !important;
    }

    .main-layout {
        width: 100%;
        max-width: 450px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .media-box {
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid #333 !important;
        max-height: 200px;
    }

    .media-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    #console {
        background-color: #000000 !important;
        border: 1px solid #424242 !important;
        padding: 15px;
        border-radius: 10px;
        font-family: monospace;
        font-size: 13px;
        color: #00e676 !important;
        text-shadow: 0 0 5px rgba(0, 230, 118, 0.4);
        height: 120px;
        overflow-y: auto;
        text-align: left;
        direction: ltr;
    }
  </style>
  <link rel="stylesheet" href="includes/style.css">
</head>
<body>

  <h1>Nadeyar Duhoky<br>
    <span style="font-size: 16px; color: #00e5ff;">07504314239</span><br>
    Exploit</h1>
  
  <h3 id="UA">Running on:</h3>

  <hr>

  <!-- تێکستێ جووڵاو (Ticker) -->
  <div class="ticker-container">
    <div class="ticker-text">خێر هاتن بۆ ماڵپەڕێ هۆستێ Nadeyar Duhoky - بۆ پشته‌ڤانی و پەیوەندی: 07504314239</div>
  </div>

  <div class="btn-container">
    <form id="kernel-options">
      <div>
        <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
        <label for="netctrl-exploit">NetCtrl</label>
      </div>
      <div>
        <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
        <label for="lapse-exploit">Lapse</label>
      </div>
    </form>
    <button id="jeilbrek">Jeilbrek</button>
    <div class="autoJb">
      <input class="mt-2" id="autoJbInput" type="checkbox">
      <label for="autoJbInput" id="autoJbLabel">Auto Jailbreak</label>
    </div>
  </div>

  <div class="main-layout">
    <div class="media-box">
      <img src="includes/cat.jpg" alt="A cat staring at you">
    </div>

    <pre id="console">Ready. Awaiting execution...</pre>
  </div>

  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>
</body>
</html>
