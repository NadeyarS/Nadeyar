<!doctype html>
<html lang="en" manifest="cache.manifest">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>PS4 CSSFontFace Exploit</title>
    <link rel="stylesheet" href="includes/style.css" />

    <!-- ئەڤ کۆدە دێ ب زۆری هەمی تشتان ڤەشێریت ژبلی دوگمەی و دوگمەی ئێخیتە نیڤا شاشەیێ -->
    <style>
      #console,
      #UA,
      #kernel-options,
      .logo,
      #status,
      .auto-panel,
      #countdown {
        display: none !important;
      }

      body, html {
        height: 100%;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #111; /* رەنگێ ڕەش بۆ پاشبنەمایێ */
      }

      .foreground {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
      }
      
      /* دڵنیابوون ژ مانەڤەیا دوگمەی */
      #jeilbrek {
        display: block !important;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Background Console -->
      <pre id="console">Ready...
Waiting for execution...</pre>

      <!-- Hidden Elements (Required by script.js) -->
      <h3 id="UA"></h3>

      <form id="kernel-options">
        <input type="radio" id="netctrl-exploit" name="kernel" value="netctrl" checked />
        <label for="netctrl-exploit">NetCtrl</label>
        <input type="radio" id="lapse-exploit" name="kernel" value="lapse" />
        <label for="lapse-exploit">Lapse</label>
      </form>

      <!-- Foreground -->
      <div class="foreground">
        <header class="logo">
          <h1>PS4 CSSFontFace-Exploit</h1>
          <p>by ntfargo and thanks to him</p>
        </header>

        <button id="jeilbrek" class="jb-button" type="button">
          <span class="power-icon"></span>
          <span class="button-text"> JAILBREAK </span>
        </button>

        <div id="status" class="status">READY</div>

        <!-- Auto Jailbreak -->
        <div class="auto-panel">
          <label class="checkbox-container">
            <input id="autoJbInput" type="checkbox" />
            <span class="checkmark"></span>
            <span class="auto-title"> AUTO JB </span>
          </label>
          <span id="autoJbLabel"></span>
        </div>

        <!-- Countdown -->
        <div id="countdown" class="countdown">Auto JB in 5...</div>
      </div>
    </div>

    <script src="src/main.js"></script>
    <script src="includes/script.js"></script>
  </body>
</html>
