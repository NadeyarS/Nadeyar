<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nadeyar Duhoky - Exploit Host</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #050b14 !important;
        color: #e0e0e0 !important;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    /* ناڤێ تە ب شینێ نێۆن */
    h1 {
        font-size: 26px;
        text-align: center;
        margin-bottom: 5px;
        color: #00e5ff !important;
        text-shadow: 0 0 15px rgba(0, 229, 255, 0.8), 0 0 30px rgba(0, 229, 255, 0.4);
        line-height: 1.3;
        font-weight: 800;
    }

    /* ژمارەیا تە ب ڕەنگێ پەمەیی/مۆرێ نێۆن */
    .phone-title {
        font-size: 22px;
        color: #ff00ff !important;
        text-shadow: 0 0 15px rgba(255, 0, 255, 0.8), 0 0 30px rgba(255, 0, 255, 0.4);
        display: block;
        margin: 5px 0 8px 0;
        font-weight: 800;
        letter-spacing: 1px;
        text-align: center;
    }

    h3#UA {
        font-size: 13px;
        color: #00e676 !important;
        text-shadow: 0 0 6px rgba(0, 230, 118, 0.4);
        margin-bottom: 12px;
        font-weight: 600;
        text-align: center;
        max-width: 450px;
        word-break: break-all;
        padding: 0 10px;
    }

    hr {
        width: 80%;
        max-width: 450px;
        border: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, #00e5ff, transparent) !important;
        margin-bottom: 15px;
    }

    /* تێکستێ جووڵاو (Ticker) ب ڕەنگێ زەردێ نێۆن */
    .ticker-container {
        width: 100%;
        max-width: 450px;
        background-color: rgba(17, 24, 39, 0.8) !important;
        border: 1px solid #1f2937 !important;
        border-radius: 8px;
        overflow: hidden;
        white-space: nowrap;
        box-sizing: border-box;
        margin-bottom: 15px;
        padding: 8px 0;
    }

    .ticker-text {
        display: inline-block;
        padding-left: 100%;
        animation: ticker 18s linear infinite;
        color: #ffea00 !important;
        font-size: 13px;
        font-weight: 700;
        text-shadow: 0 0 6px rgba(255, 234, 0, 0.5);
    }

    @keyframes ticker {
        0% {
            transform: translate3d(0, 0, 0);
        }
        100% {
            transform: translate3d(-100%, 0, 0);
        }
    }

    .btn-container {
        background-color: rgba(17, 24, 39, 0.9) !important;
        border: 1px solid #1f2937 !important;
        padding: 20px;
        border-radius: 15px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8) !important;
        margin-bottom: 20px;
        text-align: center;
    }

    #kernel-options {
        margin-bottom: 15px;
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    #kernel-options label {
        cursor: pointer;
        font-weight: 600;
        color: #00e676 !important;
        text-shadow: 0 0 4px rgba(0, 230, 118, 0.3);
    }

    #jeilbrek {
        background: linear-gradient(135deg, #0284c7, #0369a1) !important;
        color: #fff !important;
        border: none !important;
        padding: 12px 30px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        width: 100%;
        transition: 0.3s;
        box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4) !important;
    }

    #jeilbrek:hover {
        background: linear-gradient(135deg, #0369a1, #0284c7) !important;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6) !important;
    }

    .autoJb {
        margin-top: 15px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        font-size: 14px;
    }

    #autoJbLabel {
        color: #00e676 !important;
        font-weight: 600;
        text-shadow: 0 0 4px rgba(0, 230, 118, 0.3);
    }

    .main-layout {
        width: 100%;
        max-width: 450px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    /* قەبارە و بەرزییا وێنەی گەلەک هاتە مەزنکرن (بەرزی 420px) */
    .media-box {
        width: 100%;
        height: 420px; 
        border-radius: 15px;
        overflow: hidden;
        border: 2px solid #1f2937 !important;
        background-color: #111827;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .media-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    #console {
        background-color: #030712 !important;
        border: 1px solid #1f2937 !important;
        padding: 15px;
        border-radius: 10px;
        font-family: monospace;
        font-size: 13px;
        color: #00e676 !important;
        text-shadow: 0 0 6px rgba(0, 230, 118, 0.5);
        height: 120px;
        overflow-y: auto;
        text-align: left;
        direction: ltr;
    }
  </style>
  <link rel="stylesheet" href="includes/style.css">
</head>
<body>

  <h1>Nadeyar Duhoky</h1>
  <span class="phone-title">07504314239</span>
  <h1 style="font-size: 20px; margin-top: -5px;">Exploit</h1>
  
  <h3 id="UA">Running on:</h3>

  <hr>

  <!-- تێکستێ جووڵاو (Ticker) ب ڕەنگێ زەردێ نێۆن -->
  <div class="ticker-container">
    <div class="ticker-text">خێر هاتن بۆ ماڵپەڕێ هۆستێ Nadeyar Duhoky - بازارێ دشداشا - بۆ پشته‌ڤانی و پەیوەندی: 07504314239</div>
  </div>

  <div class="btn-container">
    <form id="kernel-options">
      <div>
        <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
        <label for="netctrl-exploit">NetCtrl</label>
      </div>
      <div>
        <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
        <label for="lapse-exploit">Lapse</label>
      </div>
    </form>
    <button id="jeilbrek">Jeilbrek</button>
    <div class="autoJb">
      <input class="mt-2" id="autoJbInput" type="checkbox">
      <label for="autoJbInput" id="autoJbLabel">Executing</label>
    </div>
  </div>

  <div class="main-layout">
    <div class="media-box">
      <img src="includes/cat.jpg" alt="Nadeyar Electronics">
    </div>

    <pre id="console">Ready. Awaiting execution...</pre>
  </div>

  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>
</body>
</html>
